    }

    function appendFilterToInput(targetId, tag) {
        const inp = document.getElementById(targetId);
        inp.value = (inp.value + ' ' + tag).trim();
        if (targetId === 'filter-input') render();
        DOM['tag-menu'].classList.remove('show');
    }

    function toggleSavedFilters(e) {
        e.stopPropagation();
        const menu = DOM['filter-menu'];
        let html = `<div class="menu-item" style="font-weight:bold; border-bottom:1px solid #ccc" onclick="App.saveCurrentFilter()">+ ${getLang('saveCurrentFilter', '儲存當前過濾')}</div>`;

        if (config.saved_filters && config.saved_filters.length > 0) {
            config.saved_filters.forEach((f, idx) => {
                html += `<div class="menu-item"><span onclick="App.applyFilter('${f.q}')">${f.name}</span> <span style="float:right; color:red; margin-left:10px;" onclick="App.removeFilter(event, ${idx})">✕</span></div>`;
            });
        } else {
            html += `<div class="menu-empty">${getLang('noSavedFilters', '尚無儲存的過濾器')}</div>`;
        }
        menu.innerHTML = html;
        positionMenu(e.target, menu);
    }

    function removeFilter(e, idx) {
        e.stopPropagation();
        if (confirm(getLang('deleteFilterConfirm', '刪除此過濾器？'))) {
            config.saved_filters.splice(idx, 1);
            saveConfig();
            DOM['filter-menu'].classList.remove('show');
        }
    }

    function saveCurrentFilter() {
        const q = DOM['filter-input'].value.trim();
        if (!q) return alert(getLang('filterInputEmpty', '過濾欄是空的'));
        const name = prompt(getLang('nameFilter', '請為此過濾器命名:'), q);
        if (name) {
            if (!config.saved_filters) config.saved_filters = [];
            config.saved_filters.push({name, q});
            saveConfig();
            DOM['filter-menu'].classList.remove('show');
        }
    }

    function applyFilter(q) {
        DOM['filter-input'].value = q;
        render();
        DOM['filter-menu'].classList.remove('show');
    }

    // === UI Helpers ===
    function applyTheme(n) {
        document.body.setAttribute('data-theme', n);
    }

    function applyMainWidth(width) {
        const w = parseInt(width);
        document.documentElement.style.setProperty('--main-width', w + 'px');
        DOM['main-width-value'].textContent = w + 'px';
    }

    function applyOpacity(value) {
        document.documentElement.style.setProperty('--hidden-opacity', value);
        DOM['opacity-value'].textContent = parseFloat(value).toFixed(1);
    }

    function applyDoneOpacity(value) {
        document.documentElement.style.setProperty('--done-opacity', value);
        DOM['done-opacity-value'].textContent = parseFloat(value).toFixed(1);
    }

    function toggleDesc(index) {
        const el = document.getElementById(`desc-${index}`);
        const btn = document.querySelector(`.desc-toggle[data-index="${index}"]`);
        if (el.classList.contains('expanded')) {
            el.classList.remove('expanded');
            btn.textContent = getLang('expand', '展開...');
        } else {
            el.classList.add('expanded');
            btn.textContent = getLang('collapse', '收起');
            setTimeout(() => el.scrollIntoView({behavior: 'smooth', block: 'nearest'}), 100);
        }
    }

    // === Input Resizing ===
    const calculateOptimalLines = (content, minLines, baseCharsPerLine) => {
        if (!content) return minLines;
        const lines = content.split('\n');
        let wrappedLines = 0;
        lines.forEach(line => {
            wrappedLines += Math.ceil(line.length / baseCharsPerLine);
        });
        const required = Math.max(lines.length, wrappedLines);
        if (required <= minLines) return minLines;
        if (required <= 8) return required;
        if (required <= 15) return required + 1;
        if (required <= 25) return required + 2;
        return Math.min(required + 3, 35);
    };

    function resizeTitleInput(action) {
        const el = DOM['inp-sub'];
        const lineHeight = 24;
        const currentLines = Math.round((parseInt(el.style.height) || 60) / lineHeight);
        let newLines;

        if (action === 'large') newLines = Math.min(currentLines + 1, 80);
        else if (action === 'small') newLines = Math.max(currentLines - 1, 1);
        else newLines = currentLines === 3 ? calculateOptimalLines(el.value, 3, 40) : 3;

        el.style.height = (newLines * lineHeight) + 'px';
        el.focus();
    }

    function resizeDescInput(action) {
        const el = DOM['inp-desc'];
        const lineHeight = 24;
        const currentLines = Math.round((parseInt(el.style.height) || 100) / lineHeight);
        let newLines;

        if (action === 'large') newLines = Math.min(currentLines + 5, 80);
        else if (action === 'small') newLines = Math.max(currentLines - 5, 1);
        else newLines = currentLines === 4 ? calculateOptimalLines(el.value, 4, 50) : 4;

        el.style.height = (newLines * lineHeight) + 'px';
        el.focus();
    }

    // === Text Insertion ===
    function insertDateToDesc() {
        const now = new Date();
        const str = `${now.toISOString().split('T')[0]} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        insertTextAtCursor(DOM['inp-desc'], `[${str}] `);
    }

    function insertRepeatSeparator() {
        insertTextAtCursor(DOM['inp-desc'], '\n' + REPEAT_SEPARATOR + '\n');
    }

    function insertRepeatSeparatorBoth() {
        insertTextAtCursor(DOM['inp-desc'], '\n' + REPEAT_SEPARATOR_BOTH + '\n');
    }

    function insertTextAtCursor(el, text) {
        if (el.selectionStart !== undefined) {
            const start = el.selectionStart;
            const before = el.value.substring(0, start);
            const after = el.value.substring(el.selectionEnd);
            el.value = before + text + after;
            el.selectionStart = el.selectionEnd = start + text.length;
        } else {
            el.value += text;
        }
        el.focus();
    }

    function renumberNumberedItems() {
        const el = DOM['inp-desc'];
        const lines = el.value.split('\n');
        const result = [];
        const counters = {};

        for (const line of lines) {
            const indentMatch = line.match(/^[\s]*/);
            const indent = indentMatch ? indentMatch[0] : '';
            const content = line.substring(indent.length);
            const numMatch = content.match(/^(\d+)\.(\s|$)/);

            if (numMatch) {
                if (!counters[indent]) counters[indent] = 1;
                const after = content.substring(numMatch[0].length);
                result.push(indent + counters[indent] + '.' + (after.startsWith(' ') ? '' : ' ') + after);
                counters[indent]++;
            } else {
                result.push(line);
                if (content.trim() !== '') counters[indent] = 1;
            }
        }
        el.value = result.join('\n');
        el.focus();
    }

    // === Recurrence Handling ===
    function handleRecurrence(t, hasTodayContext = false) {
        const rec = t.rec || '';
        if (!rec) return;

        let match = rec.match(/^(rec:)?(\+{0,2})(\d+)([dmy])/);
        if (!match) {
            const numMatch = rec.match(/\d+/);
            if (numMatch) match = ['rec:+' + numMatch[0] + 'd', 'rec:', '+', numMatch[0], 'd'];
            else return;
        }

        const prefix = match[2];
        const val = parseInt(match[3]);
        const unit = match[4];
        const today = todayStr();
        let newDue;

        if (prefix === '') {
            if (!t.due) return;
            const base = new Date(t.due);
            if (unit === 'm') base.setMonth(base.getMonth() + val);
            else if (unit === 'y') base.setFullYear(base.getFullYear() + val);
            else base.setDate(base.getDate() + val);
            newDue = base.toISOString().split('T')[0];
        } else if (prefix === '+') {
            const base = new Date(today);
            if (unit === 'm') base.setMonth(base.getMonth() + val);
            else if (unit === 'y') base.setFullYear(base.getFullYear() + val);
            else base.setDate(base.getDate() + val);
            newDue = base.toISOString().split('T')[0];
        } else if (prefix === '++') {
            if (val === 0) {
                newDue = today;
            } else {
                const base = new Date(t.due);
                let testDate = new Date(base);
                while (testDate <= new Date(today)) {
                    if (unit === 'm') testDate.setMonth(testDate.getMonth() + val);
                    else if (unit === 'y') testDate.setFullYear(testDate.getFullYear() + val);
                    else testDate.setDate(testDate.getDate() + val);
                }
                newDue = testDate.toISOString().split('T')[0];
            }
        }

        let newThres = null;
        if (t.threshold && t.due) {
            const diff = new Date(t.due).getTime() - new Date(t.threshold).getTime();
            const nextThresTime = new Date(newDue).getTime() - diff;
            newThres = new Date(nextThresTime).toISOString().split('T')[0];
        }

        const next = {
            ...t, created: todayStr(), done: false, doneDate: null,
            due: newDue, threshold: newThres
        };

        if (t.desc && t.desc.includes(REPEAT_SEPARATOR)) {
            const parts = t.desc.split(REPEAT_SEPARATOR);
            next.desc = parts[0].trim();
            t.desc = parts.slice(1).join(REPEAT_SEPARATOR).trim();
        } else if (t.desc && t.desc.includes(REPEAT_SEPARATOR_BOTH)) {
            const parts = t.desc.split(REPEAT_SEPARATOR_BOTH);
            const aboveContent = parts[0].trim();
            const belowContent = parts.slice(1).join(REPEAT_SEPARATOR_BOTH).trim();
            next.desc = aboveContent;
            t.desc = (aboveContent + (belowContent ? '\n' + belowContent : '')).trim();
        }

        if (hasTodayContext) {
            const newDate = (newThres || newDue).replace(/-/g, '');
            next.sub = next.sub + ' @☀️.' + newDate;
        } else {
            next.sub = next.sub.replace(/@☀️\.\d{8}/g, '').trim();
        }

        tasks.push(next);
    }

    function normalizeRecurrence(recValue) {
        if (!recValue || recValue.trim() === '') return '';
        let value = recValue.trim().replace(/^rec:/i, '');
        const match = value.match(/^(\+{0,2})(\d+)([dmy])$/i);
        if (match) return 'rec:' + value;

        const numMatch = value.match(/(\d+)/);
        const unitMatch = value.match(/([dmy])/i);
        if (numMatch && unitMatch) {
            const num = numMatch[1];
            const unit = unitMatch[1].toLowerCase();
            const prefixMatch = value.match(/^(\+{1,2})/);
            const prefix = prefixMatch ? prefixMatch[1] : '';
            return 'rec:' + prefix + num + unit;
        }

        const onlyNum = value.match(/^(\+{0,2})(\d+)$/);
        if (onlyNum) return 'rec:' + onlyNum[1] + onlyNum[2] + 'd';
        return '';
    }

    // === Parsing ===
    function parseLines(t) {
        return t ? t.split('\n').filter(x => x.trim()).map(parseLine) : [];
    }

    function parseLine(line) {
        const t = {sub: "", desc: "", done: false};
        let temp = line.trim();

        if (temp.startsWith('x ')) {
            t.done = true;
            t.doneDate = temp.split(' ')[1];
            temp = temp.split(' ').slice(2).join(' ');
        }

        if (temp.match(/^\([A-Z]\) /)) {
            t.pri = temp.substring(0, 3);
            temp = temp.substring(4);
        }

        const dm = temp.match(/^(\d{4}-\d{2}-\d{2}) /);
        if (dm) {
            t.created = dm[1];
            temp = temp.substring(11);
        }

        const descM = temp.match(/desc:"((?:[^"\\]|\\.)*)"/);
        if (descM) {
            t.desc = descM[1].replace(/\\"/g, '"').replace(/\\\\/g, '\\').replace(/\\n/g, '\n');
            temp = temp.replace(descM[0], '').trim();
        }

        const subW = [];
        temp.split(/\s+/).forEach(w => {
            if (w.startsWith('due:')) t.due = w.slice(4);
            else if (w.startsWith('rec:')) t.rec = w.slice(4);
            else if (w.startsWith('id:')) t.legacyId = w.slice(3);
            else if (w.startsWith('t:')) t.threshold = w.slice(2);
            else if (w.startsWith('desc:') && !t.desc) t.desc = w.slice(5).replace(/\\n/g, '\n');
            else subW.push(w);
        });

        t.sub = subW.join(' ');
        return t;
    }

    function stringifyTask(t) {
        const arr = [];
        if (t.done) arr.push(`x ${t.doneDate}`);
        if (t.pri) arr.push(t.pri);
        if (t.created) arr.push(t.created);
        arr.push(t.sub);
        if (t.due) arr.push(`due:${t.due}`);
        if (t.threshold) arr.push(`t:${t.threshold}`);
        if (t.rec) arr.push(`rec:${t.rec}`);
        if (config.show_id === true || config.show_id === "true") {
            if (t.legacyId) arr.push(`id:${t.legacyId}`);
        }
        if (t.desc) arr.push(`desc:"${t.desc.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`);
        return arr.join(' ');
    }

    function initPriSelect() {
        const sel = DOM['inp-pri'];
        let html = '<option value="">-</option>';
        for (let i = 65; i <= 90; i++) {
            const c = String.fromCharCode(i);
            html += `<option value="(${c})">${c}</option>`;
        }
        sel.innerHTML = html;
    }

    function initDefaultPriSelect() {
        const sel = DOM['cfg-default-priority'];
        let html = '<option value="">-</option>';
        for (let i = 65; i <= 90; i++) {
            const c = String.fromCharCode(i);
            html += `<option value="(${c})">${c}</option>`;
        }
        sel.innerHTML = html;
    }

    function getEffectivePriority(t) {
        return t.pri || config.default_priority;
    }

    // === Initialization ===
    async function init() {
        currentLang = detectLanguage();
        await loadLanguageResources(currentLang);
        initDOMCache();
        initPriSelect();
        initDefaultPriSelect();
        initSortMenuUI();
        initEventDelegation();
        await loadConfig();
        await loadData();

        window.onscroll = () => {
            DOM['back-top'].style.display = window.scrollY > 300 ? 'flex' : 'none';
        };
        updateUI();
    }

    // === Public API ===
    return {
        // Lifecycle
        init, updateUI, render, sync, saveConfig,
        // Data
        loadData, loadConfig,
        // UI
        applyTheme, applyMainWidth, applyOpacity, applyDoneOpacity, toggleSettingsModal, closeEditModal,
        // Task operations
        openEditModal, saveTask, saveTaskAndKeepOpen, deleteTask, deleteTaskFromEdit, completeTask, uncompleteTask,
        // Filters
        toggleDoneSection, clearFilter, appendFilter, toggleShowHidden, toggleTodayFilter,
        // Today tasks
        toggleTodayTaskInModal, toggleTaskToday,
        // Input
        resizeTitleInput, resizeDescInput, insertDateToDesc, insertRepeatSeparator, insertRepeatSeparatorBoth, renumberNumberedItems,
        // Sort
        toggleSortMenu, updateSort, updateDoneSort, initSortMenuUI, initDoneSortMenuUI,
        // Tags
        openTagMenu, openContextMenu, openProjectMenu, appendTagToInput, toggleSavedFilters, removeFilter, saveCurrentFilter, applyFilter, appendFilterToInput,
        toggleProjectChildren, toggleAllProjectChildren,
        // Project View
        openProjectView, closeProjectView, toggleProjectViewChildren, toggleProjectViewTaskGroup, toggleProjectViewDesc, toggleProjectViewDescriptions, toggleAllProjectViewNodes, jumpToTask,
        // Desc
        toggleDesc,
        // Tab
        switchTab
    };
})();

// Initialize on load
window.onload = App.init;
</script>
